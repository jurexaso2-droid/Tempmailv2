<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temporary Email - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0px) } 50% { transform: translateY(-10px) } }
    @keyframes glow { 0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.5) } 100% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.8) } }
    .float { animation: float 6s ease-in-out infinite }
    .glow { animation: glow 2s ease-in-out infinite alternate }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0px 1000px rgba(255,255,255,0.1) inset; -webkit-text-fill-color: white !important }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 relative overflow-x-hidden">
  
  <!-- Background Effects -->
  <div class="absolute inset-0 overflow-hidden opacity-30">
    <div class="absolute top-20 left-10 w-32 h-32 sm:w-48 sm:h-48 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl float"></div>
    <div class="absolute top-40 right-10 w-32 h-32 sm:w-48 sm:h-48 bg-indigo-500 rounded-full mix-blend-multiply filter blur-xl float" style="animation-delay: 2s;"></div>
    <div class="absolute bottom-20 left-1/3 w-32 h-32 sm:w-48 sm:h-48 bg-pink-500 rounded-full mix-blend-multiply filter blur-xl float" style="animation-delay: 4s;"></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4 sm:p-6">
    <div class="w-full max-w-sm sm:max-w-md">
      
      <!-- Logo Section -->
      <div class="text-center mb-6 sm:mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl shadow-2xl mb-4 sm:mb-6 glow">
          <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
          </svg>
        </div>
        <h1 class="text-2xl sm:text-4xl font-bold bg-gradient-to-r from-white to-purple-200 bg-clip-text text-transparent mb-2">
          Temporary Email        </h1>
        <p class="text-purple-200 text-sm sm:text-lg">Secure tempmail platform</p>
      </div>

      <!-- Main Card -->
      <div class="bg-white/10 backdrop-blur-xl rounded-2xl sm:rounded-3xl shadow-2xl border border-white/20 p-6 sm:p-8">
        
        <!-- Flash Messages -->
        <div class="mb-3 rounded-lg px-4 py-3 text-sm bg-green-100 text-green-800">Registered! Please login.</div>        
        <!-- Tab Navigation -->
        <div class="flex bg-white/5 rounded-xl p-1 mb-6 sm:mb-8 border border-white/10">
          <a href="?t=login" class="flex-1 text-center py-2 sm:py-3 px-3 sm:px-4 rounded-lg font-medium transition-all duration-300 text-sm sm:text-base bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg">
            Sign In
          </a>
          <a href="?t=register" class="flex-1 text-center py-2 sm:py-3 px-3 sm:px-4 rounded-lg font-medium transition-all duration-300 text-sm sm:text-base text-purple-100 hover:text-white hover:bg-white/10">
            Sign Up
          </a>
        </div>

        <!-- Forms -->
                <form method="post" class="space-y-4 sm:space-y-6">
          <input type="hidden" name="action" value="login" />
          
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
              <svg class="h-4 w-4 sm:h-5 sm:w-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
            <input required name="email" type="email" placeholder="Enter your email" 
                   class="w-full pl-10 sm:pl-12 pr-4 py-3 sm:py-4 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-purple-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm sm:text-base">
          </div>
          
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
              <svg class="h-4 w-4 sm:h-5 sm:w-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input required name="password" type="password" placeholder="Enter your password" 
                   class="w-full pl-10 sm:pl-12 pr-10 py-3 sm:py-4 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-purple-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm sm:text-base">
            <button type="button" class="absolute inset-y-0 right-0 pr-3 sm:pr-4 flex items-center text-purple-300 hover:text-white transition-colors" onclick="togglePassword(this)">
              <svg class="h-4 w-4 sm:h-5 sm:w-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="h-4 w-4 sm:h-5 sm:w-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L12 12m6.121-3.878a3 3 0 00-4.243-4.243m4.243 4.243L21 21"></path>
              </svg>
            </button>
          </div>
          
          <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 sm:py-4 px-6 sm:px-8 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg text-sm sm:text-base">
            Sign In to Account
          </button>
        </form>
        
        
        <!-- Footer -->
        <div class="mt-6 sm:mt-8 text-center">
          <p class="text-purple-200 text-xs sm:text-sm">
            Don't have an account?            <a href="?t=register" class="text-indigo-300 hover:text-white font-semibold transition-colors ml-1">
              Sign up            </a>
          </p>
        </div>
      </div>

      <!-- Bottom Info -->
      <div class="text-center mt-4 sm:mt-6 text-purple-200/70 text-xs sm:text-sm">
        <p>✨ Secure • Private • Reliable ✨</p>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword(button) {
      const input = button.parentElement.querySelector('input[type="password"], input[type="text"]');
      const eyeOpen = button.querySelector('.eye-open');
      const eyeClosed = button.querySelector('.eye-closed');
      
      if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
      } else {
        input.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Form submission loading
      document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', function(e) {
          const btn = form.querySelector('button[type="submit"]');
          const orig = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = `<svg class="animate-spin w-4 h-4 inline mr-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Processing...`;
          setTimeout(() => { btn.disabled = false; btn.innerHTML = orig; }, 8000);
        });
      });

      // Password strength
      const pwd = document.querySelector('input[name="password"]');
      const str = document.getElementById('strength');
      if (pwd && str) {
        pwd.addEventListener('input', function() {
          let s = 0;
          if (this.value.length >= 6) s++;
          if (this.value.match(/[a-z]/) && this.value.match(/[A-Z]/)) s++;
          if (this.value.match(/\d/)) s++;
          if (this.value.match(/[^a-zA-Z\d]/)) s++;
          const colors = ['bg-red-400', 'bg-yellow-400', 'bg-blue-400', 'bg-green-400'];
          str.className = `w-2 h-2 rounded-full ${colors[s] || 'bg-red-400'}`;
        });
      }

      // Auto-hide messages
      setTimeout(() => {
        document.querySelectorAll('.flash-success, [class*="bg-red-500"], [class*="bg-green-500"]').forEach(msg => {
          msg.style.opacity = '0';
          msg.style.transform = 'translateY(-20px)';
          setTimeout(() => msg.remove(), 300);
        });
      }, 4000);
    });
  </script>
</body>
</html>
